# Map host panel labels to aster-sysinfo sensors on the Proxmox host.
#
# Key = label used in homelab.json
# Value = sensor name from `aster-sysinfo --console`
#
# Adjust the root disk device, CPU temperature and network interface for your host.

host_cpu_percent: cpu_usage_percent
host_mem_percent: mem_usage_percent
host_cpu_temp: temperature_cpu
host_root_percent: disk_/dev/mapper/pve-root_usage_percent
host_net_down: network_vmbr0_download_speed
host_net_up: network_vmbr0_upload_speed
